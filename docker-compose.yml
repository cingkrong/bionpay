version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bionpay-postgres
    restart: always
    environment:
      POSTGRES_DB: ${PGDATABASE:-bionpay_db}
      POSTGRES_USER: ${PGUSER:-bionpay}
      POSTGRES_PASSWORD: ${PGPASSWORD:-bionpay_secret_2026}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-bionpay} -d ${PGDATABASE:-bionpay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bionpay-gateway:
    build: .
    container_name: bionpay-gateway
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgres://${PGUSER:-bionpay}:${PGPASSWORD:-bionpay_secret_2026}@postgres:5432/${PGDATABASE:-bionpay_db}
    volumes:
      - ./.GOPAY_SESI_JANGAN_DIHAPUS.json:/app/.GOPAY_SESI_JANGAN_DIHAPUS.json

volumes:
  postgres_data:

